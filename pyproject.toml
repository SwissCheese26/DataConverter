[project]
name = "dataconverter"
version = "0.1.0"
description = "Windows DataConverter - audio conversion backend"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dataconverter = "dataconverter.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
