name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: ffmpeg + ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - name: Show tool versions
        shell: bash
        run: |
          ffmpeg -version | head -1
          python --version
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --durations=15

  build-exe:
    name: Windows app (.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Build
        shell: pwsh
        run: ./build_windows.ps1
      - name: Check that the packaged app starts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $log = "selftest.txt"
          $p = Start-Process -FilePath "dist\DataConverter\DataConverter.exe" -ArgumentList "--selftest", $log -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if (-not (Test-Path $log)) { throw "selftest wrote no result: the app did not start" }
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit code $($p.ExitCode))" }
      - name: Check that the packaged app really converts files
        shell: pwsh
        run: |
          $report = "convert-report.txt"
          $p = Start-Process -FilePath "dist\DataConverter\DataConverter.exe" -ArgumentList "--selftest-convert", $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { throw "no report written: the app crashed" }
          if ($p.ExitCode -ne 0) { throw "packaged conversion check failed (exit code $($p.ExitCode))" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\DataConverter -DestinationPath DataConverter-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DataConverter-windows
          path: DataConverter-windows.zip
